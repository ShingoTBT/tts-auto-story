<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  index.php が指定しているMac/Windows向けフォント名(ヒラギノ角ゴ ProN, ヒラギノ角ゴ,
  游ゴシック, メイリオ)を、Linux実行環境にインストールした日本語フォント
  (Noto Sans CJK JP)に強制的にエイリアスする設定。
  これにより「写」などの字が中国語字形にならず、正しい日本語字形で描画される。
-->
<fontconfig>
  <match target="pattern">
    <test name="family"><string>Hiragino Kaku Gothic ProN</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK JP</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Hiragino Sans</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK JP</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Yu Gothic</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK JP</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Meiryo</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK JP</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans CJK JP</string></edit>
  </match>
</fontconfig>
