name: account3_threads_post

on:
  schedule:
    # 毎時0分(24回/日)
    - cron: "0 * * * *"
  workflow_dispatch: {}

concurrency:
  group: account3-threads-post
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate Threads post
        id: generate
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python generate_threads_engagement.py accounts/account3_threads.yaml

      - name: Post to Threads via Zernio
        if: steps.generate.outcome == 'success'
        continue-on-error: true
        env:
          ZERNIO_API_KEY_ACCOUNT3: ${{ secrets.ZERNIO_API_KEY_ACCOUNT3 }}
          ZERNIO_THREADS_ACCOUNT_ID: ${{ secrets.ZERNIO_THREADS_ACCOUNT_ID }}
        run: python post_to_threads.py accounts/account3_threads.yaml "${{ steps.generate.outputs.output_path }}"

      - name: Notify ChatWork
        if: steps.generate.outcome == 'success'
        env:
          CHATWORK_API_TOKEN: ${{ secrets.CHATWORK_API_TOKEN }}
          CHATWORK_ROOM_ID: ${{ secrets.CHATWORK_ROOM_ID }}
        run: python notify_chatwork.py accounts/account3_threads.yaml "${{ steps.generate.outputs.output_path }}"

      - name: Commit generated content and logs
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          set +e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add logs/ outputs/ diagnostics/
          git diff --staged --quiet
          if [ "$?" -eq 0 ]; then
            echo "no staged changes, nothing to commit"
            exit 0
          fi

          commit_out=$(git commit -m "chore: account3 threads post ($(date +'%Y-%m-%d %H:%M'))" 2>&1)
          commit_rc=$?
          if [ "$commit_rc" -ne 0 ]; then
            safe_out=$(echo "$commit_out" | tr '\n' ' ' | head -c 800)
            echo "::error::account3 git commit failed (rc=$commit_rc): $safe_out"
            exit 1
          fi

          pushed=0
          for i in 1 2 3 4 5; do
            pull_out=$(git pull --rebase origin main 2>&1)
            pull_rc=$?
            if [ "$pull_rc" -ne 0 ]; then
              safe_out=$(echo "$pull_out" | tr '\n' ' ' | head -c 500)
              echo "::error::account3 pull-rebase attempt $i failed (rc=$pull_rc): $safe_out"
              git rebase --abort >/dev/null 2>&1
              sleep $((RANDOM % 5 + 1))
              continue
            fi
            push_out=$(git push 2>&1)
            push_rc=$?
            if [ "$push_rc" -eq 0 ]; then
              pushed=1
              break
            fi
            safe_out=$(echo "$push_out" | tr '\n' ' ' | head -c 500)
            echo "::error::account3 push attempt $i failed (rc=$push_rc): $safe_out"
            sleep $((RANDOM % 5 + 1))
          done
          if [ "$pushed" -ne 1 ]; then
            echo "::error::failed to push account3 after all retries"
            exit 1
          fi
