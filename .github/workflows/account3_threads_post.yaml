name: account3_threads_post

on:
  schedule:
    # 毎時0分(24回/日)
    - cron: "0 * * * *"
  workflow_dispatch: {}

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch trending news candidate
        id: fetch
        continue-on-error: true
        run: python fetch_trending_news.py accounts/account3_threads.yaml

      - name: Generate Threads post
        id: generate
        if: steps.fetch.outcome == 'success'
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python generate_threads_post.py accounts/account3_threads.yaml

      - name: Post to Threads via Zernio
        if: steps.generate.outcome == 'success'
        continue-on-error: true
        env:
          ZERNIO_API_KEY_ACCOUNT3: ${{ secrets.ZERNIO_API_KEY_ACCOUNT3 }}
          ZERNIO_THREADS_ACCOUNT_ID: ${{ secrets.ZERNIO_THREADS_ACCOUNT_ID }}
        run: python post_to_threads.py accounts/account3_threads.yaml "${{ steps.generate.outputs.output_path }}"

      - name: Notify ChatWork
        if: steps.generate.outcome == 'success'
        env:
          CHATWORK_API_TOKEN: ${{ secrets.CHATWORK_API_TOKEN }}
          CHATWORK_ROOM_ID: ${{ secrets.CHATWORK_ROOM_ID }}
        run: python notify_chatwork.py accounts/account3_threads.yaml "${{ steps.generate.outputs.output_path }}"

      - name: Commit generated content and logs
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add logs/ outputs/
          git diff --staged --quiet || git commit -m "chore: account3 threads post ($(date +'%Y-%m-%d %H:%M'))"
          git diff --staged --quiet || git push || (git pull --rebase && git push)
