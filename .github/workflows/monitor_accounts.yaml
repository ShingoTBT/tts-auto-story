name: monitor_accounts

on:
  schedule:
    # 3時間おき
    - cron: "0 */3 * * *"
  workflow_dispatch: {}

concurrency:
  group: monitor-accounts
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pyyaml requests
      - name: Monitor all accounts
        env:
          CHATWORK_API_TOKEN: ${{ secrets.CHATWORK_API_TOKEN }}
          CHATWORK_ROOM_ID: ${{ secrets.CHATWORK_ROOM_ID }}
        run: >
          python monitor_accounts.py
          accounts/account1_emotional.yaml
          accounts/account2_news.yaml
          accounts/account3_threads.yaml
          accounts/account4_threads_engagement.yaml
          accounts/account5_tiktok_engagement.yaml
