name: account1_emotional_story

on:
  schedule:
    # 毎朝7:00 JST = 前日22:00 UTC
    - cron: "0 22 * * *"
    # 毎夕19:00 JST = 当日10:00 UTC
    - cron: "0 10 * * *"
  workflow_dispatch: {}  # 手動実行もできるようにしておく

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # タイトルログをコミットし直すため
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate story
        id: generate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python generate.py accounts/account1_emotional.yaml

      # --- 画像化ステップ(Puppeteer)は別途追加予定 ---
      # - name: Render images via existing tool
      #   run: node puppeteer_render.js accounts/account1_emotional.yaml

      # --- Slack通知ステップも別途追加予定 ---
      # - name: Notify Slack
      #   env:
      #     SLACK_WEBHOOK_ACCOUNT1: ${{ secrets.SLACK_WEBHOOK_ACCOUNT1 }}
      #   run: node notify_slack.js accounts/account1_emotional.yaml

      - name: Commit updated title log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add logs/ outputs/
          git diff --staged --quiet || git commit -m "chore: add generated story ($(date +'%Y-%m-%d %H:%M'))"
          git push
