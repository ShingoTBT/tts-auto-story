name: account6_tiktok_engagement

on:
  schedule:
    # 01:00 JST = 前日16:00 UTC
    - cron: "0 16 * * *"
    # 04:00 JST = 前日19:00 UTC
    - cron: "0 19 * * *"
    # 07:00 JST = 前日22:00 UTC
    - cron: "0 22 * * *"
    # 10:00 JST = 01:00 UTC
    - cron: "0 1 * * *"
    # 13:00 JST = 04:00 UTC
    - cron: "0 4 * * *"
    # 16:00 JST = 07:00 UTC
    - cron: "0 7 * * *"
    # 19:00 JST = 10:00 UTC
    - cron: "0 10 * * *"
    # 22:00 JST = 13:00 UTC
    - cron: "0 13 * * *"
  workflow_dispatch: {}

concurrency:
  group: account6-tiktok
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: playwright install --with-deps chromium

      - name: Install Playwright OS dependencies only (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: |
          playwright install-deps chromium
          playwright install chromium

      - name: Install Japanese fonts and configure aliases
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-noto-cjk-extra
          sudo mkdir -p /etc/fonts/conf.d
          sudo cp fontconfig/local.conf /etc/fonts/local.conf
          sudo fc-cache -f

      - name: Determine which content type to generate based on trigger time
        id: pick_config
        run: |
          SCHEDULE="${{ github.event.schedule }}"
          echo "matched cron: $SCHEDULE"
          if [ "$SCHEDULE" = "0 16 * * *" ] || [ "$SCHEDULE" = "0 22 * * *" ] || [ "$SCHEDULE" = "0 7 * * *" ]; then
            echo "config_path=accounts/account6_emotional.yaml" >> "$GITHUB_OUTPUT"
            echo "generator_script=generate.py" >> "$GITHUB_OUTPUT"
          else
            echo "config_path=accounts/account6_tiktok_engagement.yaml" >> "$GITHUB_OUTPUT"
            echo "generator_script=generate_tiktok_engagement.py" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate post
        id: generate
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python ${{ steps.pick_config.outputs.generator_script }} ${{ steps.pick_config.outputs.config_path }}

      - name: Render image via existing tool
        if: steps.generate.outcome == 'success'
        run: python render_images.py ${{ steps.pick_config.outputs.config_path }} "${{ steps.generate.outputs.output_path }}"

      - name: Commit and push generated content (image must be public before posting)
        if: steps.generate.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add logs/ outputs/ diagnostics/ overrides/
          if ! git diff --staged --quiet; then
            git commit -m "chore: account6 tiktok post ($(date +'%Y-%m-%d %H:%M'))"
            pushed=0
            for i in 1 2 3 4 5; do
              if git pull --rebase origin main && git push; then
                pushed=1
                break
              fi
              echo "push attempt $i failed, retrying..."
              git rebase --abort 2>/dev/null || true
              sleep $((RANDOM % 5 + 1))
            done
            if [ "$pushed" -ne 1 ]; then
              echo "::error::failed to push account6 post after retries"
              exit 1
            fi
          fi

      - name: Post to TikTok via Zernio
        id: post_tiktok
        if: steps.generate.outcome == 'success'
        continue-on-error: true
        env:
          ZERNIO_API_KEY_ACCOUNT5: ${{ secrets.ZERNIO_API_KEY_ACCOUNT5 }}
          ZERNIO_TIKTOK_ACCOUNT_ID_6: ${{ secrets.ZERNIO_TIKTOK_ACCOUNT_ID_6 }}
        run: python post_to_tiktok.py ${{ steps.pick_config.outputs.config_path }} "${{ steps.generate.outputs.output_path }}"

      - name: Notify ChatWork
        if: steps.generate.outcome == 'success'
        env:
          CHATWORK_API_TOKEN: ${{ secrets.CHATWORK_API_TOKEN }}
          CHATWORK_ROOM_ID: ${{ secrets.CHATWORK_ROOM_ID }}
        run: python notify_chatwork.py ${{ steps.pick_config.outputs.config_path }} "${{ steps.generate.outputs.output_path }}"

      - name: Commit any remaining changes (e.g. error debug files)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add logs/ outputs/ diagnostics/ overrides/
          if ! git diff --staged --quiet; then
            git commit -m "chore: post-run cleanup ($(date +'%Y-%m-%d %H:%M'))"
            pushed=0
            for i in 1 2 3 4 5; do
              if git pull --rebase origin main && git push; then
                pushed=1
                break
              fi
              echo "push attempt $i failed, retrying..."
              git rebase --abort 2>/dev/null || true
              sleep $((RANDOM % 5 + 1))
            done
            if [ "$pushed" -ne 1 ]; then
              echo "::error::failed to push account6 cleanup after retries"
              exit 1
            fi
          fi
