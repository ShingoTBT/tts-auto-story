name: account6_tiktok_engagement

on:
  schedule:
    # 02:00 JST = 前日17:00 UTC (感動ストーリー)
    - cron: "0 17 * * *"
    # 12:00 JST = 03:00 UTC (涙あふれるストーリー。10-22 までは共感/議論系)
    - cron: "0 3 * * *"
    # 22:00 JST = 13:00 UTC (涙あふれるストーリー。10-22 までは共感/議論系)
    - cron: "0 13 * * *"
  workflow_dispatch: {}

concurrency:
  group: account6-tiktok
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # 2026-10-23〜 画像ではなく動画で投稿する。apt(日本語フォントの導入)は時々止まって時間切れになるため使わない
      - name: Cache fonts for video (Noto Sans/Serif JP)
        id: fonts-cache
        uses: actions/cache@v4
        with:
          path: fonts
          key: noto-jp-otf-v1

      - name: Download fonts if not cached
        if: steps.fonts-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p fonts
          for f in Sans/SubsetOTF/JP/NotoSansJP-Bold.otf Serif/SubsetOTF/JP/NotoSerifJP-SemiBold.otf; do
            curl -fsSL --retry 3 -o "fonts/$(basename "$f")" "https://github.com/notofonts/noto-cjk/raw/main/$f"
          done
          ls -la fonts

      - name: Check ffmpeg
        run: |
          if ! command -v ffmpeg >/dev/null; then
            curl -fsSL --retry 3 -o /tmp/ff.tar.xz https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
            tar -xf /tmp/ff.tar.xz -C /tmp
            sudo cp /tmp/ffmpeg-*-static/ffmpeg /tmp/ffmpeg-*-static/ffprobe /usr/local/bin/
          fi
          ffmpeg -version | head -1

      - name: Determine which content type to generate based on trigger time
        id: pick_config
        run: |
          SCHEDULE="${{ github.event.schedule }}"
          echo "matched cron: $SCHEDULE"
          # 2026-10-23〜 どの時刻も涙あふれるストーリー(ユーザー希望)。共感/議論系はアカウント5だけ
          echo "config_path=accounts/account6_emotional.yaml" >> "$GITHUB_OUTPUT"
          echo "generator_script=generate.py" >> "$GITHUB_OUTPUT"

      # 2026-10-23〜 Xserver から決まった時刻に起動する(GitHub の定時起動は遅れ・飛ばしがあるので予備)。
      # 二重投稿しないよう、直近90分以内に作っていれば今回は何もしない
      - name: Skip if posted within 90 minutes
        id: guard
        run: |
          python - <<'EOF'
          import json, os, datetime, yaml
          cfg = yaml.safe_load(open("accounts/account6_emotional.yaml", encoding="utf-8"))
          skip = False
          try:
              lines = [l for l in open(cfg["titles_log_file"], encoding="utf-8") if l.strip()]
              last = datetime.datetime.fromisoformat(json.loads(lines[-1])["generated_at"])
              minutes = (datetime.datetime.now() - last).total_seconds() / 60
              print(f"last post {minutes:.0f} minutes ago")
              skip = minutes < 90
          except Exception as e:
              print(f"guard check failed, continue: {e}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              print("skip=" + ("true" if skip else "false"), file=f)
          EOF

      - name: Generate post
        id: generate
        if: steps.guard.outputs.skip != 'true'
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python ${{ steps.pick_config.outputs.generator_script }} ${{ steps.pick_config.outputs.config_path }}

      - name: Build narrated video (ElevenLabs → Google Chirp 3 HD → VOICEVOX)
        id: video
        if: steps.generate.outcome == 'success'
        continue-on-error: true
        env:
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          SFX_BASE_URL: ${{ secrets.SFX_BASE_URL }}
          # Google の無料枠の見張り(30%で TO 付き警告・60%で自動停止)の知らせ用
          CHATWORK_API_TOKEN: ${{ secrets.CHATWORK_API_TOKEN }}
          CHATWORK_ROOM_ID: ${{ secrets.CHATWORK_ROOM_ID }}
        run: |
          src="${{ steps.generate.outputs.output_path }}"
          out="$(dirname "$src")/videos/$(basename "$src" .txt)"
          python make_story_video.py --config ${{ steps.pick_config.outputs.config_path }} "$src" "$out"
          echo "video_dir=$out" >> "$GITHUB_OUTPUT"

      - name: Commit and push generated content (image must be public before posting)
        if: steps.generate.outcome == 'success'
        run: |
          set +e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add logs/ outputs/ diagnostics/
          git add overrides/ 2>/dev/null || true
          git diff --staged --quiet
          if [ "$?" -eq 0 ]; then
            echo "no staged changes, nothing to commit"
            exit 0
          fi

          commit_out=$(git commit -m "chore: account6 tiktok post ($(date +'%Y-%m-%d %H:%M'))" 2>&1)
          commit_rc=$?
          if [ "$commit_rc" -ne 0 ]; then
            safe_out=$(echo "$commit_out" | tr '\n' ' ' | head -c 800)
            echo "::error::account6 git commit failed (rc=$commit_rc): $safe_out"
            exit 1
          fi

          pushed=0
          for i in 1 2 3 4 5; do
            pull_out=$(git pull --rebase origin main 2>&1)
            pull_rc=$?
            if [ "$pull_rc" -ne 0 ]; then
              safe_out=$(echo "$pull_out" | tr '\n' ' ' | head -c 500)
              echo "::error::account6 pull-rebase attempt $i failed (rc=$pull_rc): $safe_out"
              git rebase --abort >/dev/null 2>&1
              sleep $((RANDOM % 5 + 1))
              continue
            fi
            push_out=$(git push 2>&1)
            push_rc=$?
            if [ "$push_rc" -eq 0 ]; then
              pushed=1
              break
            fi
            safe_out=$(echo "$push_out" | tr '\n' ' ' | head -c 500)
            echo "::error::account6 push attempt $i failed (rc=$push_rc): $safe_out"
            sleep $((RANDOM % 5 + 1))
          done
          if [ "$pushed" -ne 1 ]; then
            echo "::error::failed to push account6 post after all retries"
            exit 1
          fi

      - name: Post to TikTok via Zernio
        id: post_tiktok
        if: steps.video.outcome == 'success'
        continue-on-error: true
        env:
          ZERNIO_API_KEY_ACCOUNT5: ${{ secrets.ZERNIO_API_KEY_ACCOUNT5 }}
          ZERNIO_TIKTOK_ACCOUNT_ID_6: ${{ secrets.ZERNIO_TIKTOK_ACCOUNT_ID_6 }}
        run: python post_video_to_tiktok.py ${{ steps.pick_config.outputs.config_path }} "${{ steps.generate.outputs.output_path }}" "${{ steps.video.outputs.video_dir }}"

      - name: Notify ChatWork
        if: steps.generate.outcome == 'success' && steps.post_tiktok.outcome == 'success'
        env:
          CHATWORK_API_TOKEN: ${{ secrets.CHATWORK_API_TOKEN }}
          CHATWORK_ROOM_ID: ${{ secrets.CHATWORK_ROOM_ID }}
        run: python notify_chatwork.py ${{ steps.pick_config.outputs.config_path }} "${{ steps.generate.outputs.output_path }}"

      # 投稿(Zernio)に失敗したときは「投稿通知」ではなく失敗の知らせを送る(同じアカウントは6時間に1回まで)
      - name: Notify ChatWork (post failed)
        if: steps.generate.outcome == 'success' && (steps.video.outcome == 'failure' || steps.post_tiktok.outcome == 'failure')
        continue-on-error: true
        env:
          CHATWORK_API_TOKEN: ${{ secrets.CHATWORK_API_TOKEN }}
          CHATWORK_ROOM_ID: ${{ secrets.CHATWORK_ROOM_ID }}
        run: python notify_chatwork.py ${{ steps.pick_config.outputs.config_path }} "${{ steps.generate.outputs.output_path }}" --failed

      - name: Commit any remaining changes (e.g. error debug files)
        if: always()
        run: |
          set +e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add logs/ outputs/ diagnostics/
          git add overrides/ 2>/dev/null || true
          git diff --staged --quiet
          if [ "$?" -eq 0 ]; then
            echo "no staged changes, nothing to commit"
            exit 0
          fi

          commit_out=$(git commit -m "chore: post-run cleanup ($(date +'%Y-%m-%d %H:%M'))" 2>&1)
          commit_rc=$?
          if [ "$commit_rc" -ne 0 ]; then
            safe_out=$(echo "$commit_out" | tr '\n' ' ' | head -c 800)
            echo "::error::account6 cleanup git commit failed (rc=$commit_rc): $safe_out"
            exit 1
          fi

          pushed=0
          for i in 1 2 3 4 5; do
            pull_out=$(git pull --rebase origin main 2>&1)
            pull_rc=$?
            if [ "$pull_rc" -ne 0 ]; then
              safe_out=$(echo "$pull_out" | tr '\n' ' ' | head -c 500)
              echo "::error::account6 cleanup pull-rebase attempt $i failed (rc=$pull_rc): $safe_out"
              git rebase --abort >/dev/null 2>&1
              sleep $((RANDOM % 5 + 1))
              continue
            fi
            push_out=$(git push 2>&1)
            push_rc=$?
            if [ "$push_rc" -eq 0 ]; then
              pushed=1
              break
            fi
            safe_out=$(echo "$push_out" | tr '\n' ' ' | head -c 500)
            echo "::error::account6 cleanup push attempt $i failed (rc=$push_rc): $safe_out"
            sleep $((RANDOM % 5 + 1))
          done
          if [ "$pushed" -ne 1 ]; then
            echo "::error::failed to push account6 cleanup after all retries"
            exit 1
          fi
