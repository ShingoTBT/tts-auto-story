name: collect_learning_data

on:
  workflow_dispatch: {}

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Collect learning data
        env:
          ZERNIO_API_KEY_ACCOUNT3: ${{ secrets.ZERNIO_API_KEY_ACCOUNT3 }}
          ZERNIO_THREADS_ACCOUNT_ID_2: ${{ secrets.ZERNIO_THREADS_ACCOUNT_ID_2 }}
        run: |
          echo "=== pwd/ls確認 ==="
          pwd
          ls -la
          ls -la diagnostics/
          python3 diagnostics/collect_learning_data.py 2>&1 | tee /tmp/collect_log.txt || true
          mkdir -p outputs/account4_threads
          cp /tmp/collect_log.txt outputs/account4_threads/collect_stdout.txt
      - name: Commit result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add outputs/
          git status
          if ! git diff --staged --quiet; then
            git commit -m "chore: collected comment learning data"
            git pull --rebase origin main
            git push
          fi
