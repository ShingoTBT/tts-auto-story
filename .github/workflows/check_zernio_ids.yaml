name: check_zernio_ids

# 一時的な確認用(このブランチへの push でだけ動く)。10-24: 暗号化した効果音を GitHub の Secrets で開けるか
on:
  push:
    branches: [check-zernio-ids]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Decrypt sfx (no output of contents)
        env:
          SFX_BASE_URL: ${{ secrets.SFX_BASE_URL }}
        run: |
          SFX_PASS="$(printf '%s' "$SFX_BASE_URL" | tr -d '\r\n' | sed 's/^[ \t]*//;s/[ \t]*$//')" \
            openssl enc -d -aes-256-cbc -pbkdf2 -in assets/sfx.tar.enc -pass env:SFX_PASS | tar -tvf - && echo "DECRYPT_OK"
