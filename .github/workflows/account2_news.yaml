name: account2_news_story

on:
  schedule:
    # 01:00 JST = 前日16:00 UTC
    - cron: "0 16 * * *"
    # 06:00 JST = 前日21:00 UTC
    - cron: "0 21 * * *"
    # 11:00 JST = 02:00 UTC
    - cron: "0 2 * * *"
    # 16:00 JST = 07:00 UTC
    - cron: "0 7 * * *"
    # 21:00 JST = 12:00 UTC
    - cron: "0 12 * * *"
  # 10-31〜 手動で起動するときに force を true にすると、90分の二重投稿防止を飛ばす(ユーザーの臨時の投稿用)
  workflow_dispatch:
    inputs:
      force:
        type: boolean
        default: false

concurrency:
  group: account2-news
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      # 10-24 待たされた回でも最新の記録(posted_videos.jsonl など)を読むよう、起動時点ではなく今の main を取る
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # 2026-10-23〜 画像ではなく動画で投稿する。apt(日本語フォントの導入)は時々止まって時間切れになるため使わない
      - name: Cache fonts for video (Noto Sans/Serif JP)
        id: fonts-cache
        uses: actions/cache@v4
        with:
          path: fonts
          key: noto-jp-otf-v1

      - name: Download fonts if not cached
        if: steps.fonts-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p fonts
          for f in Sans/SubsetOTF/JP/NotoSansJP-Bold.otf Serif/SubsetOTF/JP/NotoSerifJP-SemiBold.otf; do
            curl -fsSL --retry 3 -o "fonts/$(basename "$f")" "https://github.com/notofonts/noto-cjk/raw/main/$f"
          done
          ls -la fonts

      # 11-02〜 ffmpeg の入っていない実行環境に当たり、ダウンロードも失敗して定刻の回が止まることがあった(11-01 に3回など)。
      # 一度取ってきた ffmpeg を保存しておき、無いときは 配布元2か所 → apt の順に試す
      - name: Cache ffmpeg
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: ffmpeg-bin
          key: ffmpeg-static-v1

      - name: Check ffmpeg
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            if [ ! -x ffmpeg-bin/ffmpeg ] || [ ! -x ffmpeg-bin/ffprobe ]; then
              rm -rf ffmpeg-bin /tmp/ffx && mkdir -p ffmpeg-bin /tmp/ffx
              if curl -fsSL --retry 5 --retry-all-errors --max-time 300 -o /tmp/ff.tar.xz https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz \
                 && tar -xf /tmp/ff.tar.xz -C /tmp/ffx; then
                echo "ffmpeg from johnvansickle.com"
              elif curl -fsSL --retry 5 --retry-all-errors --max-time 300 -o /tmp/ff.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz \
                 && tar -xf /tmp/ff.tar.xz -C /tmp/ffx; then
                echo "ffmpeg from BtbN/FFmpeg-Builds"
              fi
              find /tmp/ffx -type f \( -name ffmpeg -o -name ffprobe \) -exec cp {} ffmpeg-bin/ \;
              if [ ! -x ffmpeg-bin/ffmpeg ] || [ ! -x ffmpeg-bin/ffprobe ]; then
                rm -rf ffmpeg-bin
                echo "ffmpeg from apt"
                sudo timeout 300 apt-get update -qq && sudo timeout 300 apt-get install -y -qq ffmpeg
              fi
            fi
            if [ -x ffmpeg-bin/ffmpeg ]; then
              sudo cp ffmpeg-bin/ffmpeg ffmpeg-bin/ffprobe /usr/local/bin/
            fi
          fi
          ffmpeg -version | head -1
          ffprobe -version | head -1

      # 2026-10-23〜 Xserver から決まった時刻に起動する(GitHub の定時起動は遅れ・飛ばしがあるので予備)。
      # 二重投稿しないよう、直近90分以内に投稿していれば今回は何もしない
      # 11-02〜 予備の定時起動は1〜4時間遅れて届き余分な投稿になっていたため、自分の枠がもう投稿済み・次の枠まで90分を切っていれば何もしない(schedule_guard.py)
      - name: Skip if posted within 90 minutes
        id: guard
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          FORCE: ${{ inputs.force }}
        run: python schedule_guard.py accounts/account2_news.yaml 1,6,11,16,21

      # 10-28〜 06:00・11:00 の回は「社会人なら知っておくべき最新ニュース」の解説(account2_explainer.yaml)、それ以外は芸能・スポーツ
      # 起動が遅れても、何時の枠の回か(01・06・11・16・21時)で決める。11-02〜 枠は schedule_guard.py が出す
      # (予備の定時起動は元の予定の時刻、Xserver・手動は今より前で一番近い枠)
      # 11-02〜 臨時の投稿(force)は時間に関係なく芸能・スポーツ(臨時の 8:00・13:00 が解説の枠に入らないように)
      - name: Pick config by time slot
        id: pick
        env:
          FORCE: ${{ inputs.force }}
          SLOT: ${{ steps.guard.outputs.slot }}
        run: |
          python - <<'EOF2'
          import datetime, os
          now = datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=9)))
          slots = [1, 6, 11, 16, 21]
          slot = int(os.environ.get("SLOT") or max([h for h in slots if h <= now.hour], default=21))
          cfg = "accounts/account2_explainer.yaml" if slot in (6, 11) else "accounts/account2_news.yaml"
          if os.environ.get("FORCE") == "true":
              cfg = "accounts/account2_news.yaml"
          print(f"now {now:%H:%M} JST → slot {slot}:00 → {cfg}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              print("config=" + cfg, file=f)
          EOF2

      - name: Fetch trending news candidate
        id: fetch
        if: steps.guard.outputs.skip != 'true'
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # バズった投稿の確認用(再生数)
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          ZERNIO_TIKTOK_ACCOUNT_ID_2: ${{ secrets.ZERNIO_TIKTOK_ACCOUNT_ID_2 }}
          # 11-01〜 X の日本のトレンド(x_trends.py)
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: python fetch_trending_news.py ${{ steps.pick.outputs.config }}

      - name: Generate news story
        id: generate
        if: steps.fetch.outcome == 'success'
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python generate_news.py ${{ steps.pick.outputs.config }}

      - name: Build narrated video (ElevenLabs → Google Chirp 3 HD → VOICEVOX)
        id: video
        if: steps.generate.outcome == 'success'
        continue-on-error: true
        env:
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          SFX_BASE_URL: ${{ secrets.SFX_BASE_URL }}
          # 内容に合わせた効果音を AI が選ぶ用(10-25〜)
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Google の無料枠の見張り(30%で TO 付き警告・60%で自動停止)の知らせ用
          CHATWORK_API_TOKEN: ${{ secrets.CHATWORK_API_TOKEN }}
          CHATWORK_ROOM_ID: ${{ secrets.CHATWORK_ROOM_ID }}
        run: |
          src="${{ steps.generate.outputs.output_path }}"
          out="$(dirname "$src")/videos/$(basename "$src" .txt)"
          python make_story_video.py --config ${{ steps.pick.outputs.config }} "$src" "$out"
          echo "video_dir=$out" >> "$GITHUB_OUTPUT"

      - name: Commit and push generated content (images must be public before posting)
        if: steps.generate.outcome == 'success'
        run: |
          set +e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add logs/ outputs/ diagnostics/
          git diff --staged --quiet
          if [ "$?" -eq 0 ]; then
            echo "no staged changes, nothing to commit"
            exit 0
          fi

          commit_out=$(git commit -m "chore: add generated news post ($(date +'%Y-%m-%d %H:%M'))" 2>&1)
          commit_rc=$?
          if [ "$commit_rc" -ne 0 ]; then
            safe_out=$(echo "$commit_out" | tr '\n' ' ' | head -c 800)
            echo "::error::account2 git commit failed (rc=$commit_rc): $safe_out"
            exit 1
          fi

          pushed=0
          for i in 1 2 3 4 5; do
            pull_out=$(git pull --rebase origin main 2>&1)
            pull_rc=$?
            if [ "$pull_rc" -ne 0 ]; then
              safe_out=$(echo "$pull_out" | tr '\n' ' ' | head -c 500)
              echo "::error::account2 pull-rebase attempt $i failed (rc=$pull_rc): $safe_out"
              git rebase --abort >/dev/null 2>&1
              sleep $((RANDOM % 5 + 1))
              continue
            fi
            push_out=$(git push 2>&1)
            push_rc=$?
            if [ "$push_rc" -eq 0 ]; then
              pushed=1
              break
            fi
            safe_out=$(echo "$push_out" | tr '\n' ' ' | head -c 500)
            echo "::error::account2 push attempt $i failed (rc=$push_rc): $safe_out"
            sleep $((RANDOM % 5 + 1))
          done
          if [ "$pushed" -ne 1 ]; then
            echo "::error::failed to push account2 after all retries"
            exit 1
          fi

      - name: Post to TikTok via Zernio
        id: post_tiktok
        if: steps.video.outcome == 'success'
        continue-on-error: true
        env:
          # 説明欄のつかみを作る用(10-26〜)
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          ZERNIO_TIKTOK_ACCOUNT_ID_2: ${{ secrets.ZERNIO_TIKTOK_ACCOUNT_ID_2 }}
        run: python post_video_to_tiktok.py ${{ steps.pick.outputs.config }} "${{ steps.generate.outputs.output_path }}" "${{ steps.video.outputs.video_dir }}"

      - name: Notify ChatWork
        if: steps.generate.outcome == 'success' && steps.post_tiktok.outcome == 'success'
        env:
          CHATWORK_API_TOKEN: ${{ secrets.CHATWORK_API_TOKEN }}
          CHATWORK_ROOM_ID: ${{ secrets.CHATWORK_ROOM_ID }}
        run: python notify_chatwork.py ${{ steps.pick.outputs.config }} "${{ steps.generate.outputs.output_path }}"

      # 投稿(Zernio)に失敗したときは「投稿通知」ではなく失敗の知らせを送る(同じアカウントは6時間に1回まで)
      - name: Notify ChatWork (post failed)
        if: steps.generate.outcome == 'success' && (steps.video.outcome == 'failure' || steps.post_tiktok.outcome == 'failure')
        continue-on-error: true
        env:
          CHATWORK_API_TOKEN: ${{ secrets.CHATWORK_API_TOKEN }}
          CHATWORK_ROOM_ID: ${{ secrets.CHATWORK_ROOM_ID }}
        run: python notify_chatwork.py ${{ steps.pick.outputs.config }} "${{ steps.generate.outputs.output_path }}" --failed

      - name: Commit any remaining changes (e.g. error debug files)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          set +e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add logs/ outputs/ diagnostics/
          git diff --staged --quiet
          if [ "$?" -eq 0 ]; then
            echo "no staged changes, nothing to commit"
            exit 0
          fi

          commit_out=$(git commit -m "chore: post-run cleanup ($(date +'%Y-%m-%d %H:%M'))" 2>&1)
          commit_rc=$?
          if [ "$commit_rc" -ne 0 ]; then
            safe_out=$(echo "$commit_out" | tr '\n' ' ' | head -c 800)
            echo "::error::account2 cleanup git commit failed (rc=$commit_rc): $safe_out"
            exit 1
          fi

          pushed=0
          for i in 1 2 3 4 5; do
            pull_out=$(git pull --rebase origin main 2>&1)
            pull_rc=$?
            if [ "$pull_rc" -ne 0 ]; then
              safe_out=$(echo "$pull_out" | tr '\n' ' ' | head -c 500)
              echo "::error::account2 cleanup pull-rebase attempt $i failed (rc=$pull_rc): $safe_out"
              git rebase --abort >/dev/null 2>&1
              sleep $((RANDOM % 5 + 1))
              continue
            fi
            push_out=$(git push 2>&1)
            push_rc=$?
            if [ "$push_rc" -eq 0 ]; then
              pushed=1
              break
            fi
            safe_out=$(echo "$push_out" | tr '\n' ' ' | head -c 500)
            echo "::error::account2 cleanup push attempt $i failed (rc=$push_rc): $safe_out"
            sleep $((RANDOM % 5 + 1))
          done
          if [ "$pushed" -ne 1 ]; then
            echo "::error::failed to push account2 cleanup after all retries"
            exit 1
          fi
