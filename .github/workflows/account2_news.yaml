name: account2_news_story

on:
  schedule:
    # 01:00 JST = 前日16:00 UTC
    - cron: "0 16 * * *"
    # 06:00 JST = 前日21:00 UTC
    - cron: "0 21 * * *"
    # 11:00 JST = 02:00 UTC
    - cron: "0 2 * * *"
    # 16:00 JST = 07:00 UTC
    - cron: "0 7 * * *"
    # 21:00 JST = 12:00 UTC
    - cron: "0 12 * * *"
  workflow_dispatch: {}

concurrency:
  group: account2-news
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      # 10-24 待たされた回でも最新の記録(posted_videos.jsonl など)を読むよう、起動時点ではなく今の main を取る
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # 2026-10-23〜 画像ではなく動画で投稿する。apt(日本語フォントの導入)は時々止まって時間切れになるため使わない
      - name: Cache fonts for video (Noto Sans/Serif JP)
        id: fonts-cache
        uses: actions/cache@v4
        with:
          path: fonts
          key: noto-jp-otf-v1

      - name: Download fonts if not cached
        if: steps.fonts-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p fonts
          for f in Sans/SubsetOTF/JP/NotoSansJP-Bold.otf Serif/SubsetOTF/JP/NotoSerifJP-SemiBold.otf; do
            curl -fsSL --retry 3 -o "fonts/$(basename "$f")" "https://github.com/notofonts/noto-cjk/raw/main/$f"
          done
          ls -la fonts

      - name: Check ffmpeg
        run: |
          if ! command -v ffmpeg >/dev/null; then
            curl -fsSL --retry 3 -o /tmp/ff.tar.xz https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
            tar -xf /tmp/ff.tar.xz -C /tmp
            sudo cp /tmp/ffmpeg-*-static/ffmpeg /tmp/ffmpeg-*-static/ffprobe /usr/local/bin/
          fi
          ffmpeg -version | head -1

      # 2026-10-23〜 Xserver から決まった時刻に起動する(GitHub の定時起動は遅れ・飛ばしがあるので予備)。
      # 二重投稿しないよう、直近90分以内に投稿していれば今回は何もしない
      - name: Skip if posted within 90 minutes
        id: guard
        run: |
          python - <<'EOF'
          import json, os, datetime, yaml
          cfg = yaml.safe_load(open("accounts/account2_news.yaml", encoding="utf-8"))
          skip = False
          try:
              # 10-24 投稿に失敗した回でも止まらないよう、投稿できた時刻(posted_videos.jsonl)で見る
              lines = [l for l in open(cfg["output_dir"] + "/posted_videos.jsonl", encoding="utf-8") if l.strip()]
              last = datetime.datetime.fromisoformat(json.loads(lines[-1])["posted_at"])
              minutes = (datetime.datetime.now(datetime.timezone.utc) - last).total_seconds() / 60
              print(f"last post {minutes:.0f} minutes ago")
              skip = minutes < 90
          except Exception as e:
              print(f"guard check failed, continue: {e}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              print("skip=" + ("true" if skip else "false"), file=f)
          EOF

      - name: Fetch trending news candidate
        id: fetch
        if: steps.guard.outputs.skip != 'true'
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python fetch_trending_news.py accounts/account2_news.yaml

      - name: Generate news story
        id: generate
        if: steps.fetch.outcome == 'success'
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python generate_news.py accounts/account2_news.yaml

      - name: Build narrated video (ElevenLabs → Google Chirp 3 HD → VOICEVOX)
        id: video
        if: steps.generate.outcome == 'success'
        continue-on-error: true
        env:
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          SFX_BASE_URL: ${{ secrets.SFX_BASE_URL }}
          # 内容に合わせた効果音を AI が選ぶ用(10-25〜)
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Google の無料枠の見張り(30%で TO 付き警告・60%で自動停止)の知らせ用
          CHATWORK_API_TOKEN: ${{ secrets.CHATWORK_API_TOKEN }}
          CHATWORK_ROOM_ID: ${{ secrets.CHATWORK_ROOM_ID }}
        run: |
          src="${{ steps.generate.outputs.output_path }}"
          out="$(dirname "$src")/videos/$(basename "$src" .txt)"
          python make_story_video.py --config accounts/account2_news.yaml "$src" "$out"
          echo "video_dir=$out" >> "$GITHUB_OUTPUT"

      - name: Commit and push generated content (images must be public before posting)
        if: steps.generate.outcome == 'success'
        run: |
          set +e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add logs/ outputs/ diagnostics/
          git diff --staged --quiet
          if [ "$?" -eq 0 ]; then
            echo "no staged changes, nothing to commit"
            exit 0
          fi

          commit_out=$(git commit -m "chore: add generated news post ($(date +'%Y-%m-%d %H:%M'))" 2>&1)
          commit_rc=$?
          if [ "$commit_rc" -ne 0 ]; then
            safe_out=$(echo "$commit_out" | tr '\n' ' ' | head -c 800)
            echo "::error::account2 git commit failed (rc=$commit_rc): $safe_out"
            exit 1
          fi

          pushed=0
          for i in 1 2 3 4 5; do
            pull_out=$(git pull --rebase origin main 2>&1)
            pull_rc=$?
            if [ "$pull_rc" -ne 0 ]; then
              safe_out=$(echo "$pull_out" | tr '\n' ' ' | head -c 500)
              echo "::error::account2 pull-rebase attempt $i failed (rc=$pull_rc): $safe_out"
              git rebase --abort >/dev/null 2>&1
              sleep $((RANDOM % 5 + 1))
              continue
            fi
            push_out=$(git push 2>&1)
            push_rc=$?
            if [ "$push_rc" -eq 0 ]; then
              pushed=1
              break
            fi
            safe_out=$(echo "$push_out" | tr '\n' ' ' | head -c 500)
            echo "::error::account2 push attempt $i failed (rc=$push_rc): $safe_out"
            sleep $((RANDOM % 5 + 1))
          done
          if [ "$pushed" -ne 1 ]; then
            echo "::error::failed to push account2 after all retries"
            exit 1
          fi

      - name: Post to TikTok via Zernio
        id: post_tiktok
        if: steps.video.outcome == 'success'
        continue-on-error: true
        env:
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          ZERNIO_TIKTOK_ACCOUNT_ID_2: ${{ secrets.ZERNIO_TIKTOK_ACCOUNT_ID_2 }}
        run: python post_video_to_tiktok.py accounts/account2_news.yaml "${{ steps.generate.outputs.output_path }}" "${{ steps.video.outputs.video_dir }}"

      - name: Notify ChatWork
        if: steps.generate.outcome == 'success' && steps.post_tiktok.outcome == 'success'
        env:
          CHATWORK_API_TOKEN: ${{ secrets.CHATWORK_API_TOKEN }}
          CHATWORK_ROOM_ID: ${{ secrets.CHATWORK_ROOM_ID }}
        run: python notify_chatwork.py accounts/account2_news.yaml "${{ steps.generate.outputs.output_path }}"

      # 投稿(Zernio)に失敗したときは「投稿通知」ではなく失敗の知らせを送る(同じアカウントは6時間に1回まで)
      - name: Notify ChatWork (post failed)
        if: steps.generate.outcome == 'success' && (steps.video.outcome == 'failure' || steps.post_tiktok.outcome == 'failure')
        continue-on-error: true
        env:
          CHATWORK_API_TOKEN: ${{ secrets.CHATWORK_API_TOKEN }}
          CHATWORK_ROOM_ID: ${{ secrets.CHATWORK_ROOM_ID }}
        run: python notify_chatwork.py accounts/account2_news.yaml "${{ steps.generate.outputs.output_path }}" --failed

      - name: Commit any remaining changes (e.g. error debug files)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          set +e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add logs/ outputs/ diagnostics/
          git diff --staged --quiet
          if [ "$?" -eq 0 ]; then
            echo "no staged changes, nothing to commit"
            exit 0
          fi

          commit_out=$(git commit -m "chore: post-run cleanup ($(date +'%Y-%m-%d %H:%M'))" 2>&1)
          commit_rc=$?
          if [ "$commit_rc" -ne 0 ]; then
            safe_out=$(echo "$commit_out" | tr '\n' ' ' | head -c 800)
            echo "::error::account2 cleanup git commit failed (rc=$commit_rc): $safe_out"
            exit 1
          fi

          pushed=0
          for i in 1 2 3 4 5; do
            pull_out=$(git pull --rebase origin main 2>&1)
            pull_rc=$?
            if [ "$pull_rc" -ne 0 ]; then
              safe_out=$(echo "$pull_out" | tr '\n' ' ' | head -c 500)
              echo "::error::account2 cleanup pull-rebase attempt $i failed (rc=$pull_rc): $safe_out"
              git rebase --abort >/dev/null 2>&1
              sleep $((RANDOM % 5 + 1))
              continue
            fi
            push_out=$(git push 2>&1)
            push_rc=$?
            if [ "$push_rc" -eq 0 ]; then
              pushed=1
              break
            fi
            safe_out=$(echo "$push_out" | tr '\n' ' ' | head -c 500)
            echo "::error::account2 cleanup push attempt $i failed (rc=$push_rc): $safe_out"
            sleep $((RANDOM % 5 + 1))
          done
          if [ "$pushed" -ne 1 ]; then
            echo "::error::failed to push account2 cleanup after all retries"
            exit 1
          fi
