name: check_hatena_rss_diag

on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install requests
      - name: Check Hatena RSS
        run: python diagnostics/check_hatena_rss.py
      - name: Commit result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add diagnostics/
          if ! git diff --staged --quiet; then
            git commit -m "chore: hatena rss check result"
            git pull --rebase origin main
            git push
          fi
