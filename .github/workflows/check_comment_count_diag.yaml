name: check_comment_count_diag

on:
  workflow_dispatch:
    inputs:
      post_id:
        description: 'post_id to check'
        required: true
      internal_id:
        description: 'Zernio internal _id to also try (optional)'
        required: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install requests
      - name: Check comment count
        env:
          ZERNIO_API_KEY_ACCOUNT3: ${{ secrets.ZERNIO_API_KEY_ACCOUNT3 }}
          ZERNIO_THREADS_ACCOUNT_ID: ${{ secrets.ZERNIO_THREADS_ACCOUNT_ID }}
          ZERNIO_INTERNAL_ID: ${{ github.event.inputs.internal_id }}
        run: python diagnostics/check_comment_count.py "${{ github.event.inputs.post_id }}"
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add diagnostics/
          if ! git diff --staged --quiet; then
            git commit -m "chore: comment count diag result"
            git pull --rebase origin main
            git push
          fi
