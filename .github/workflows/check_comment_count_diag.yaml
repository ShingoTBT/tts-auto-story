name: check_comment_count_diag

on:
  workflow_dispatch:
    inputs:
      post_id:
        description: 'post_id to check'
        required: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install requests
      - name: Check comment count
        env:
          ZERNIO_API_KEY_ACCOUNT3: ${{ secrets.ZERNIO_API_KEY_ACCOUNT3 }}
        run: python diagnostics/check_comment_count.py "${{ github.event.inputs.post_id }}"
