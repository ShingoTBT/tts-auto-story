name: check_redirect_diag

on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install requests
      - name: Check redirect behavior
        env:
          LINK_REDIRECT_URL: ${{ secrets.LINK_REDIRECT_URL }}
          LINK_REDIRECT_SECRET: ${{ secrets.LINK_REDIRECT_SECRET }}
        run: python diagnostics/check_redirect.py
      - name: Commit result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add diagnostics/
          if ! git diff --staged --quiet; then
            git commit -m "chore: redirect diag result"
            git pull --rebase origin main
            git push
          fi
