name: preview_haiku_samples

# 安いモデル(Haiku 5.5)で各アカウントの見本の文章を作るだけの試験用。
# 投稿・チャットワーク通知はしない。本番のログ(logs/)も書き換えない。
# 見本は outputs/preview_haiku/ にコミットする。
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - ".github/workflows/preview_haiku_samples.yaml"

concurrency:
  group: preview-haiku-samples
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      PREVIEW_MODEL: "claude-haiku-5-5"
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # アカウント1のフォロワー数の確認(読み取りのみ)に使う
      ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
      ZERNIO_TIKTOK_ACCOUNT_ID: ${{ secrets.ZERNIO_TIKTOK_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build preview configs (model only changed, logs copied to /tmp)
        run: |
          python - <<'EOF'
          import os, shutil, yaml
          names = ["account1_emotional", "account2_news", "account3_threads",
                   "account4_threads_engagement", "account5_tiktok_engagement",
                   "account6_tiktok_engagement", "account6_emotional"]
          for n in names:
              with open(f"accounts/{n}.yaml", encoding="utf-8") as f:
                  c = yaml.safe_load(f)
              c["model"] = os.environ["PREVIEW_MODEL"]
              c["output_dir"] = f"outputs/preview_haiku/{n}"
              tmp_log = f"/tmp/{n}_titles.jsonl"
              if os.path.exists(c["titles_log_file"]):
                  shutil.copy(c["titles_log_file"], tmp_log)
              c["titles_log_file"] = tmp_log
              c.pop("override_queue_file", None)
              with open(f"/tmp/preview_{n}.yaml", "w", encoding="utf-8") as f:
                  yaml.safe_dump(c, f, allow_unicode=True)
          EOF

      - name: Generate samples (2 each)
        run: |
          set +e
          for i in 1 2; do
            python generate_tiktok_engagement.py /tmp/preview_account1_emotional.yaml
            python fetch_trending_news.py /tmp/preview_account2_news.yaml && python generate_news.py /tmp/preview_account2_news.yaml
            python generate_threads_engagement.py /tmp/preview_account3_threads.yaml
            python generate_threads_engagement.py /tmp/preview_account4_threads_engagement.yaml
            python generate_tiktok_engagement.py /tmp/preview_account5_tiktok_engagement.yaml
            python generate_tiktok_engagement.py /tmp/preview_account6_tiktok_engagement.yaml
            python generate.py /tmp/preview_account6_emotional.yaml
          done
          exit 0

      - name: Commit samples
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p outputs/preview_haiku
          git add outputs/preview_haiku/
          if git diff --staged --quiet; then
            echo "no samples"
            exit 0
          fi
          git commit -m "chore: haiku preview samples ($(date +'%Y-%m-%d %H:%M'))"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then exit 0; fi
            git rebase --abort >/dev/null 2>&1
            sleep $((RANDOM % 5 + 1))
          done
          exit 1
