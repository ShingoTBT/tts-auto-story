name: test_account6_emotional

on:
  workflow_dispatch: {}

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: playwright install --with-deps chromium
      - name: Install Playwright OS dependencies only (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: |
          playwright install-deps chromium
          playwright install chromium
      - name: Install Japanese fonts and configure aliases
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-noto-cjk-extra
          sudo mkdir -p /etc/fonts/conf.d
          sudo cp fontconfig/local.conf /etc/fonts/local.conf
          sudo fc-cache -f
      - name: Generate post
        id: generate
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python generate.py accounts/account6_emotional.yaml
      - name: Render image via existing tool
        if: steps.generate.outcome == 'success'
        run: python render_images.py accounts/account6_emotional.yaml "${{ steps.generate.outputs.output_path }}"
      - name: Commit and push generated content
        if: steps.generate.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add logs/ outputs/ diagnostics/
          if ! git diff --staged --quiet; then
            git commit -m "chore: account6 emotional test"
            git pull --rebase origin main
            git push
          fi
      - name: Commit any remaining changes
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add logs/ outputs/ diagnostics/
          if ! git diff --staged --quiet; then
            git commit -m "chore: post-run cleanup"
            git pull --rebase origin main
            git push
          fi
