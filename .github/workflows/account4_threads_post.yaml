name: account4_threads_post

on:
  schedule:
    # 毎時15分(account3とずらす、24回/日)
    - cron: "15 * * * *"
  workflow_dispatch: {}

concurrency:
  group: account4-threads-post
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Xserver からの毎時の合図・GitHub の定時起動・監視の自動復旧が重なっても
      # 二重投稿しないよう、直近45分以内に投稿していれば今回は何もしない
      - name: Skip if posted within 45 minutes
        id: guard
        run: |
          python - <<'EOF'
          import json, os, datetime, yaml
          cfg = yaml.safe_load(open("accounts/account4_threads_engagement.yaml", encoding="utf-8"))
          skip = False
          try:
              lines = [l for l in open(cfg["titles_log_file"], encoding="utf-8") if l.strip()]
              last = datetime.datetime.fromisoformat(json.loads(lines[-1])["generated_at"])
              minutes = (datetime.datetime.now() - last).total_seconds() / 60
              print(f"last post {minutes:.0f} minutes ago")
              skip = minutes < 45
          except Exception as e:
              print(f"guard check failed, continue: {e}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              print("skip=" + ("true" if skip else "false"), file=f)
          EOF

      - name: Generate engagement post
        id: generate
        if: steps.guard.outputs.skip != 'true'
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python generate_threads_engagement.py accounts/account4_threads_engagement.yaml

      - name: Post to Threads via Zernio
        if: steps.generate.outcome == 'success'
        continue-on-error: true
        env:
          ZERNIO_API_KEY_ACCOUNT3: ${{ secrets.ZERNIO_API_KEY_ACCOUNT3 }}
          ZERNIO_THREADS_ACCOUNT_ID_2: ${{ secrets.ZERNIO_THREADS_ACCOUNT_ID_2 }}
        run: python post_to_threads.py accounts/account4_threads_engagement.yaml "${{ steps.generate.outputs.output_path }}"

      - name: Notify ChatWork
        if: steps.generate.outcome == 'success'
        env:
          CHATWORK_API_TOKEN: ${{ secrets.CHATWORK_API_TOKEN }}
          CHATWORK_ROOM_ID: ${{ secrets.CHATWORK_ROOM_ID }}
        run: python notify_chatwork.py accounts/account4_threads_engagement.yaml "${{ steps.generate.outputs.output_path }}"

      - name: Commit generated content and logs
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          set +e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add logs/ outputs/ diagnostics/
          git diff --staged --quiet
          if [ "$?" -eq 0 ]; then
            echo "no staged changes, nothing to commit"
            exit 0
          fi

          commit_out=$(git commit -m "chore: account4 threads post ($(date +'%Y-%m-%d %H:%M'))" 2>&1)
          commit_rc=$?
          if [ "$commit_rc" -ne 0 ]; then
            safe_out=$(echo "$commit_out" | tr '\n' ' ' | head -c 800)
            echo "::error::account4 git commit failed (rc=$commit_rc): $safe_out"
            exit 1
          fi

          pushed=0
          for i in 1 2 3 4 5; do
            pull_out=$(git pull --rebase origin main 2>&1)
            pull_rc=$?
            if [ "$pull_rc" -ne 0 ]; then
              safe_out=$(echo "$pull_out" | tr '\n' ' ' | head -c 500)
              echo "::error::account4 pull-rebase attempt $i failed (rc=$pull_rc): $safe_out"
              git rebase --abort >/dev/null 2>&1
              sleep $((RANDOM % 5 + 1))
              continue
            fi
            push_out=$(git push 2>&1)
            push_rc=$?
            if [ "$push_rc" -eq 0 ]; then
              pushed=1
              break
            fi
            safe_out=$(echo "$push_out" | tr '\n' ' ' | head -c 500)
            echo "::error::account4 push attempt $i failed (rc=$push_rc): $safe_out"
            sleep $((RANDOM % 5 + 1))
          done
          if [ "$pushed" -ne 1 ]; then
            echo "::error::failed to push account4 after all retries"
            exit 1
          fi
