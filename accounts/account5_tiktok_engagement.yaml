  theme: talk
  elevenlabs_voice: "PmgfHCGeS5b7sH90BOOJ"   # Fumi(共有ライブラリ・若い女性・落ち着き)
  elevenlabs_tempo: 1.44   # 10-25 元の速さの2割増し(ユーザー「2割で」)
