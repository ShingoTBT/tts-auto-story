account_name: "account1_career"
display_name: "転職あるある_アカウント1"
chatwork_label: "転職あるある_アカウント1"
tiktok_url: "https://tiktok.com/@user2804137174301"
prompt_file: "prompts/tiktok_career_v1.md"
content_pattern_count: 0  # 0=固定パターンなし。AIが投稿ごとに自由に切り口を考える
use_follow_phase: true  # フォロワー数に応じて締めを自動切り替え(1000人未満=フォロー訴求, 以上=リンク誘導)
follower_threshold: 1000
titles_log_file: "logs/account1_career_titles.jsonl"
output_dir: "outputs/account1_career"
schedule_jst:
  - "05:30(平日)"
  - "10:00(平日)"
  - "18:00(平日)"
  - "07:00(週末)"
# 画像化ツール（Puppeteerで自動操作する既存index.phpのURL）
image_tool_url: "https://alley-oop.co.jp/tools/TikTok-Story/"
image_count: 2
min_chars: 320
max_chars: 380
model: "claude-sonnet-4-6"
recent_titles_count: 30
zernio_account_id_env: "ZERNIO_TIKTOK_ACCOUNT_ID"

monitor_platform: "tiktok"  # 監視用: tiktok または threads
monitor_max_interval_hours: 10  # これ以上投稿間隔が空いたら異常とみなす
monitor_recovery_workflow: "account1_emotional.yaml"  # 停滞検知時に自動再実行するワークフロー
