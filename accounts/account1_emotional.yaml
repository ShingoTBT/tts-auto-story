account_name: "account1_emotional"
display_name: "感動ストーリー(既存アカウント)"
chatwork_label: "涙あふれるストーリー_アカウント1"
tiktok_url: "https://tiktok.com/@user2804137174301"
prompt_file: "prompts/emotional_story_v3.md"
titles_log_file: "logs/account1_emotional_titles.jsonl"
output_dir: "outputs/account1_emotional"
notify_webhook_env: "SLACK_WEBHOOK_ACCOUNT1"
schedule_jst:
  - "06:00"
  - "12:00"
  - "18:00"
# 画像化ツール（Puppeteerで自動操作する既存index.phpのURL）
image_tool_url: "https://alley-oop.co.jp/tools/TikTok-Story/"
model: "claude-sonnet-4-6"
recent_titles_count: 30
zernio_account_id_env: "ZERNIO_TIKTOK_ACCOUNT_ID"

monitor_platform: "tiktok"  # 監視用: tiktok または threads
monitor_max_interval_hours: 10  # これ以上投稿間隔が空いたら異常とみなす
monitor_recovery_workflow: "account1_emotional.yaml"  # 停滞検知時に自動再実行するワークフロー
