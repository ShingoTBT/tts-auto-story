account_name: "account2_news"
display_name: "話題のニュース_アカウント2"
chatwork_label: "話題のニュース_アカウント2"
tiktok_url: "https://tiktok.com/@user8258702569269"
prompt_file: "prompts/news_video_v1.md"  # 10-23 動画用に短く(約280字)。画像のときは news_v1.md
titles_log_file: "logs/account2_news_titles.jsonl"
google_trend_ratio: 0.0  # 0.0=はてな100%, 1.0=Google100%, 0.5=半々
# ネタのジャンル指定。はてな＋下のRSSから、AIがジャンルに合う記事だけを選び、一般の人がよく知っている人の話題を先に並べる。
# 消すと今までどおり(はてなの全ジャンル)。10-21 ミュージシャン・アイドルだけ → 10-23 芸能・スポーツの著名人に広げた(ユーザー希望)
topic_filter: "芸能・スポーツの著名人(ミュージシャン・アイドル・芸人・俳優・タレント・スポーツ選手など)に関するニュース"
topic_filter_rules:
  - "著名人(芸能人・スポーツ選手など)が話の主役だとタイトルから読み取れるものだけを選ぶ。政治・経済・事件(芸能人やスポーツ選手が主役でないもの)・IT・アニメや漫画の作品紹介・一般人の体験談は除外"
  - "ニュースではないもの(MV・動画そのもの、歌詞、商品紹介、個人の日記やつぶやきのまとめ)も除外"
  - "訃報・病気・事故など、人の不幸を扱う記事も、TikTok で軽い口調で扱うのは不謹慎なので除外"
  - "失言・謝罪・炎上・批判・騒動・処分など、誰かが責められている話題も除外(10-23 ユーザー希望)"
topic_filter_model: "claude-sonnet-4-6"  # 10-21 Haiku 5.5 は対象外の記事も選んだため
topic_fallback_keywords: []  # AIが使えないときは、下の専門サイト(芸能・スポーツ)の記事をそのまま使う
topic_extra_rss:
  - "https://news.yahoo.co.jp/rss/topics/entertainment.xml"  # Yahoo!ニュース トピックス(エンタメ)＝大きな話題
  - "https://news.yahoo.co.jp/rss/topics/sports.xml"  # Yahoo!ニュース トピックス(スポーツ)
  - "https://news.yahoo.co.jp/rss/categories/entertainment.xml"  # Yahoo!ニュース エンタメ
  - "https://news.yahoo.co.jp/rss/categories/sports.xml"  # Yahoo!ニュース スポーツ
  - "https://www.nikkansports.com/entertainment/atom.xml"  # 日刊スポーツ 芸能
  - "https://realsound.jp/music/feed"  # リアルサウンド(音楽)
  - "https://www.musicvoice.jp/feed/"  # Music Voice
output_dir: "outputs/account2_news"
# 2026-10-23〜 動画で投稿(ナレーション付き。make_story_video.py / post_video_to_tiktok.py)
# 声は ElevenLabs、今月の残りが足りない・エラーのときは VOICEVOX(無料)。どちらを使ったかは毎朝のレポートに出る
video:
  reading_check: true   # 11-07 人名・地名・チーム名・流行りの言葉などの読み方を AI がネットで確かめてから読む（小嶋陽菜を「こじまひな」と読んだため）
  # 声の順番: ElevenLabs → Google(Chirp 3 HD・毎月100万字まで無料)→ VOICEVOX。2026-10-23〜(ユーザー希望)
  google_voice: "Zubenelgenubi"              # ja-JP-Chirp3-HD-Zubenelgenubi(男性・くだけた話し方)。10-30 Puck から変更(ユーザーが聞き比べて選択)
  google_rate: 1.44   # 10-25 元の速さの2割増し(ユーザー「2割で」)
  theme: news
  caption_teaser: true   # 10-26〜 説明欄に続きが気になる「つかみ」(caption_teaser.py。ユーザーOK)
  elevenlabs_voice: "pUgmTF2V1ptIKsYb6qON"   # rootbuzz_2_Ryo(男性・会話調)
  elevenlabs_tempo: 1.5   # 10-25 元の速さの2割増し(ユーザー「2割で」)
  voicevox_speaker: 11                       # 玄野武宏 ノーマル
  voicevox_name: "玄野武宏"
  voicevox_tempo: 1.56   # 10-25 元の速さの2割増し(ユーザー「2割で」)
  music_genres: ["POP", "ELECTRONIC", "DANCE_POP", "HIP_HOP/RAP", "EDM", "TROPICAL_HOUSE"]
  outro:   # 11-06〜 最後のCTAの画面(黄色の背景に切り替え。ユーザー「毎回取り入れてテストしていきましょう」)
    lines:
      - "毎日話題になった"
      - "ネタやニュースを投稿するので"
      - "話題に困らないアカウント！"
      - "よければフォローしてね"
    say:
      - "毎日話題になったネタやニュースを投稿するので、話題に困らないアカウント！"
      - "よければフォローしてね！"
      - "「これ詳しく解説して！」みたいなリクエストも、コメントでお気軽に！"
    note:   # 11-06〜 ボタンの下の吹き出し(ユーザー案・声でも読む)
      - "「これ詳しく解説して！」みたいな"
      - "リクエストもコメントでお気軽に！"
notify_webhook_env: "SLACK_WEBHOOK_ACCOUNT2"
schedule_jst:
  - "01:00"
  - "06:00"
  - "11:00"
  - "16:00"
  - "21:00"
image_tool_url: "https://alley-oop.co.jp/tools/TikTok-Story/"
model: "claude-sonnet-4-6"
recent_titles_count: 30
buzz_followup: true   # 10-25〜 2日前までの投稿にバズったものがあれば、同じネタを別の切り口で(buzz_followup.py)
zernio_account_id_env: "ZERNIO_TIKTOK_ACCOUNT_ID_2"  # TikTok連携後にSecrets登録

monitor_platform: "tiktok"  # 監視用: tiktok または threads
monitor_max_interval_hours: 8  # これ以上投稿間隔が空いたら異常とみなす
monitor_recovery_workflow: "account2_news.yaml"  # 停滞検知時に自動再実行するワークフロー
x_trends: true   # 11-01〜 X の日本のトレンドとも比べて、バズりやすいほうを使う(x_trends.py。ユーザー「全ての回で」)
x_force_until: "2026-11-02"   # 11-02 ユーザー「今日1日は全てXネタに」。この日(日本時間)までは、バズったネタの再利用の回以外は必ず X のトレンドから
# x_alternate: true   # 11-03 ユーザー「今日からは半々くらいに」。X のトレンドとニュース記事を交互に(直前の回が X なら次はニュース記事。バズったネタの再利用の回は数えない)  # 11-05 やめた(解説枠は X 優先・芸能スポーツ枠は記事と比べて良いほう)
x_pick_rules:   # 11-05〜 X のトレンドを選ぶときの追加の条件(ユーザー了承)
  - "誕生日・記念日・周年・「〇〇の日」・お祝いのハッシュタグ（#〇〇誕生祭 #Happy_〇〇 など）は選ばない（11-05 の集計で伸びなかった）"
  - "何かが起きた（結果・発表・騒動・驚きの出来事）と分かる話題だけを選ぶ"
