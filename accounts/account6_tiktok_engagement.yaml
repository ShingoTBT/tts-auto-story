account_name: "account6_tiktok_engagement"
display_name: "共感/議論系投稿_アカウント6(TikTok)"
chatwork_label: "共感/議論系投稿_アカウント6(TikTok)"
tiktok_url: "https://tiktok.com/@ddoo7901"
prompt_file: "prompts/tiktok_engagement_v1.md"
special_pattern_name: "2.5 特別パターン：30代主婦×家族系の悩み×賛否両論型"
special_pattern_probability: 0.3
titles_log_file: "logs/account6_tiktok_titles.jsonl"
output_dir: "outputs/account6_tiktok"
schedule_jst:
  - "01:00"
  - "04:00"
  - "07:00"
  - "10:00"
  - "13:00"
  - "16:00"
  - "19:00"
  - "22:00"
image_tool_url: "https://alley-oop.co.jp/tools/TikTok-Story/"
image_count: 2
min_chars: 320
max_chars: 400
model: "claude-sonnet-4-6"
recent_titles_count: 30
zernio_api_key_env: "ZERNIO_API_KEY_ACCOUNT5"  # アカウント1・2・5と同じデフォルトキーを使用
zernio_account_id_env: "ZERNIO_TIKTOK_ACCOUNT_ID_6"  # Zernio接続後に確定

monitor_platform: "tiktok"  # 監視用: tiktok または threads
monitor_max_interval_hours: 5  # これ以上投稿間隔が空いたら異常とみなす(1日8回想定なので短め)
monitor_recovery_workflow: "account6_tiktok_engagement.yaml"  # 停滞検知時に自動再実行するワークフロー
