account_name: "account6_emotional"
display_name: "涙あふれるストーリー_アカウント6(TikTok)"
chatwork_label: "涙あふれるストーリー_アカウント6(TikTok)"
tiktok_url: "https://tiktok.com/@ddoo7901"
prompt_file: "prompts/emotional_story_video_v1.md"  # 10-23 動画用に短く(約400字・約1分20秒)。画像のときは emotional_story_v3.md
titles_log_file: "logs/account6_emotional_titles.jsonl"
output_dir: "outputs/account6_tiktok"
# 2026-10-23〜 2:00・12:00・22:00 すべて涙あふれるストーリーを動画で投稿(ユーザー希望)
video:
  # 声の順番: ElevenLabs → Google(Chirp 3 HD・毎月100万字まで無料)→ VOICEVOX。2026-10-23〜(ユーザー希望)
  google_voice: "Sulafat"                       # ja-JP-Chirp3-HD-Sulafat(女性・温かい)
  google_rate: 1.0
  theme: story
  caption_teaser: true   # 10-26〜 説明欄に続きが気になる「つかみ」(caption_teaser.py。ユーザーOK)
  # 2026-10-30 ElevenLabs はニュース(アカウント2)専用に(ユーザー「①で」)。戻すときは次の行の # を外す
  # elevenlabs_voice: "4lOQ7A2l7HPuG7UIHiKA"   # Kyoko(共有ライブラリ・温かい若い女性)
  elevenlabs_tempo: 1.0
  voicevox_speaker: 14                       # 冥鳴ひまり
  voicevox_name: "冥鳴ひまり"
  voicevox_tempo: 1.0
  music_genres: ["NEW_AGE", "CLASSICAL", "EASY_LISTENING", "FOLK", "INDIE_FOLK"]
  music_exclude_words: ["happy", "children", "kids", "mischief", "party", "dance", "fun", "upbeat", "christmas"]
schedule_jst:
  - "02:00"
  - "12:00"
  - "22:00"
image_tool_url: "https://alley-oop.co.jp/tools/TikTok-Story/"
model: "claude-haiku-5-5"  # 2026-10-20 安いモデルに切り替え（見本で確認済み）
recent_titles_count: 30
zernio_api_key_env: "ZERNIO_API_KEY_ACCOUNT5"
zernio_account_id_env: "ZERNIO_TIKTOK_ACCOUNT_ID_6"

monitor_platform: "tiktok"
monitor_max_interval_hours: 12  # 10-23 1日3回(2:00・12:00・22:00)で最大10時間空く
monitor_recovery_workflow: "account6_tiktok_engagement.yaml"
