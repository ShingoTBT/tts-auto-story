account_name: "account3_threads"
display_name: "話題のニュース(Threads)_アカウント3"
chatwork_label: "話題のニュース_アカウント3(Threads)"
threads_url: "https://www.threads.com/@iikotobiyori"
prompt_file: "prompts/threads_news_v1.md"
titles_log_file: "logs/account3_threads_titles.jsonl"
google_trend_ratio: 0.0  # 0.0=はてな100%, 1.0=Google100%, 0.5=半々
output_dir: "outputs/account3_threads"
model: "claude-sonnet-4-6"
recent_titles_count: 30
min_chars: 350
max_chars: 450
zernio_api_key_env: "ZERNIO_API_KEY_ACCOUNT3"
zernio_account_id_env: "ZERNIO_THREADS_ACCOUNT_ID"
comment_threshold: 20
comment_check_days: 4  # 当日〜3日前までをチェック対象にする

monitor_platform: "threads"  # 監視用: tiktok または threads
monitor_max_interval_hours: 3  # これ以上投稿間隔が空いたら異常とみなす
monitor_recovery_workflow: "account3_threads_post.yaml"  # 停滞検知時に自動再実行するワークフロー
